<!doctype html>
<!-- Throwaway comparison page for the share-card domain treatments.
     Deleted once a treatment is chosen. -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fuiss.com — share card treatments</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0b0f17; color: #dbe4ee;
        font-family: ui-sans-serif, system-ui, sans-serif;
        padding: 32px 24px 64px; -webkit-font-smoothing: antialiased;
      }
      h1 { font-size: 20px; font-weight: 600; color: #f4f8fb; margin-bottom: 4px; }
      p.sub { font-size: 13px; color: #8fa0b3; margin-bottom: 28px; }
      figure { margin-bottom: 36px; }
      figcaption {
        font-family: ui-monospace, monospace; font-size: 12px;
        letter-spacing: 0.08em; color: #9fc4d4; margin-bottom: 10px;
      }
      img {
        display: block; width: 100%; max-width: 1200px; height: auto;
        border: 1px solid rgb(148 163 184 / 0.2); border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <h1>fuiss.com — one line + the "I own this!" arrow</h1>
    <p class="sub">Caveat note, hand-drawn SVG arrow landing on the domain.</p>
    <figure>
      <figcaption>ONE LINE · 68px · with the ownership arrow</figcaption>
      <img src="/og-var-oneline.png" alt="Single-line name with hand-drawn arrow" />
    </figure>
    <figure>
      <figcaption>TWO LINES · 84px · without the arrow, for comparison</figcaption>
      <img src="/og-var-mono.png" alt="Two-line name" />
    </figure>
  </body>
</html>
